name: authority-diff

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: authority
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority
    ports:
      - '55432:5432'
    volumes:
      - authority-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authority -d authority']
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      AUTHORITY_DB_URL: postgres://authority:authority@db:5432/authority
      AUTHORITY_AUTH_TOKEN: local-dev-token
      AUTHORITY_SERVER_PORT: '8787'
      AUTHORITY_LOG_LEVEL: info
    command: sh -c "pnpm db:migrate && pnpm --filter @authority/server start"
    ports:
      - '8787:8787'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  authority-db-data:
