name: authority-diff

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: authority
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority
    ports:
      - '55432:5432'
    volumes:
      - authority-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authority -d authority']
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      AUTHORITY_DB_URL: postgres://authority:authority@db:5432/authority
      AUTHORITY_AUTH_TOKEN: local-dev-token
      AUTHORITY_SERVER_PORT: '8787'
      AUTHORITY_LOG_LEVEL: info
    ports:
      - '8787:8787'
    depends_on:
      db:
        condition: service_healthy

volumes:
  authority-db-data:
