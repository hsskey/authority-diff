name: authority-diff-platform-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: authority
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority_test
    ports:
      - '55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authority -d authority_test']
      interval: 2s
      timeout: 3s
      retries: 15
